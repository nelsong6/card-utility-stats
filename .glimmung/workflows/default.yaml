phases:
  - name: prepare
    kind: k8s_job
    run_on: success
    purpose: work
    workflow_filename: ""
    workflow_ref: main
    inputs: {}
    outputs:
      - ssh_endpoint
      - tailnet_ip
      - working_dir
      - bridge_ready
    requirements: {}
    verify: false
    recycle_policy: null
    evidence_verification_gate: false
    depends_on: []
    jobs:
      - id: env-prep
        name: Environment prep
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: mint-credentials
            title: Mint SSH cert + Tailscale auth key
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
          - slug: bring-up-tailnet
            title: Bring up Tailscale
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
          - slug: resolve-host-ip
            title: Resolve laptop tailnet IP
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
          - slug: probe-ssh
            title: Probe SSH reachability
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
          - slug: probe-mod-set
            title: Verify allowed mods
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
          - slug: install-mcp-start-sts2
            title: Install MCP + start STS2
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
          - slug: probe-bridge-ready
            title: Wait for SpireLensMcp bridge
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
          - slug: emit-env-outputs
            title: Emit env outputs
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-prep.sh
        timeout_seconds: 1200
        managed: true
        checkout:
          repo: nelsong6/spirelens
          ref: main
          path: /workspace/spirelens
        working_directory: /workspace
  - name: llm-work
    kind: k8s_job
    run_on: success
    purpose: work
    workflow_filename: ""
    workflow_ref: main
    inputs:
      ssh_endpoint: ${{ phases.prepare.outputs.ssh_endpoint }}
      tailnet_ip: ${{ phases.prepare.outputs.tailnet_ip }}
      working_dir: ${{ phases.prepare.outputs.working_dir }}
    outputs:
      - test_plan
      - implementation
      - branch_name
    requirements: {}
    verify: false
    recycle_policy: null
    evidence_verification_gate: false
    depends_on:
      - prepare
    jobs:
      - id: llm-test-plan
        name: 'LLM: author test plan'
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: run-test-plan
            title: Run test plan
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/test-plan.sh
          - slug: collect-test-plan
            title: Collect artifact
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/test-plan.sh
        timeout_seconds: 1200
        managed: true
        checkout:
          repo: nelsong6/spirelens
          ref: main
          path: /workspace/spirelens
        working_directory: /workspace
      - id: llm-implement
        name: 'LLM: implement'
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: run-implementation
            title: Run implementation
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/implement.sh
          - slug: push-branch
            title: Confirm branch push
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/implement.sh
          - slug: collect-implementation
            title: Collect implementation
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/implement.sh
        timeout_seconds: 3000
        managed: true
        checkout:
          repo: nelsong6/spirelens
          ref: main
          path: /workspace/spirelens
        working_directory: /workspace
  - name: llm-verify
    kind: k8s_job
    run_on: success
    purpose: verification
    workflow_filename: ""
    workflow_ref: main
    inputs:
      branch_name: ${{ phases.llm-work.outputs.branch_name }}
      implementation: ${{ phases.llm-work.outputs.implementation }}
      ssh_endpoint: ${{ phases.prepare.outputs.ssh_endpoint }}
      tailnet_ip: ${{ phases.prepare.outputs.tailnet_ip }}
      test_plan: ${{ phases.llm-work.outputs.test_plan }}
      working_dir: ${{ phases.prepare.outputs.working_dir }}
    outputs:
      - verification
    requirements: {}
    verify: true
    recycle_policy: null
    evidence_verification_gate: false
    depends_on:
      - llm-work
    jobs:
      - id: llm-verify
        name: 'LLM: Verify in STS2'
        image: ""
        command: []
        args: []
        env:
          AGENT_SCREENSHOT_CONTAINER: artifacts
          AGENT_SCREENSHOT_CONTAINER_URL: https://glimmung.romaine.life/v1/artifacts
          AGENT_SCREENSHOT_STORAGE_ACCOUNT: romaineglimmungartifacts
        steps:
          - slug: build-and-deploy
            title: Build + deploy mod
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/verify.sh
          - slug: prepare-scenario
            title: Prepare scenario
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/verify.sh
          - slug: run-verification
            title: Run verification
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/verify.sh
          - slug: collect-evidence
            title: Collect evidence
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/verify.sh
          - slug: upload-screenshots
            title: Upload screenshots
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/verify.sh
          - slug: emit-verification
            title: Emit verification
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/verify.sh
        timeout_seconds: 2400
        managed: true
        checkout:
          repo: nelsong6/spirelens
          ref: main
          path: /workspace/spirelens
        working_directory: /workspace
  - name: evidence-gate
    kind: k8s_job
    run_on: success
    purpose: evidence_gate
    workflow_filename: ""
    workflow_ref: main
    inputs:
      verification: ${{ phases.llm-verify.outputs.verification }}
    outputs: []
    requirements: {}
    verify: false
    recycle_policy:
      max_attempts: 3
      "on":
        - verify_fail
        - verify_malformed
      lands_at: prepare
    evidence_verification_gate: true
    depends_on:
      - llm-verify
    jobs:
      - id: evidence-verification-gate
        name: Check evidence
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: evaluate-verdict
            title: Evaluate verification verdict
            type: run
            run: |-
              set -Eeuo pipefail
              raw="${GLIMMUNG_INPUT_VERIFICATION:-}"
              if [ -z "${raw}" ]; then
                echo "verification input is empty" >&2
                exit 2
              fi
              status="$(printf '%s' "${raw}" | jq -er '.status // empty')" || {
                echo "verification input is not valid JSON or missing status" >&2
                exit 2
              }
              printf "verification.status = '%s'\n" "${status}"
              printf '%s' "${raw}" | jq -r '.reasons[]? | "reason: \(.)"'
              if [ "${status}" = "pass" ]; then
                exit 0
              fi
              exit 1
              	
            shell: bash
        timeout_seconds: 60
        managed: true
  - name: cleanup_early
    kind: k8s_job
    run_on: always
    purpose: teardown
    workflow_filename: ""
    workflow_ref: main
    inputs: {}
    outputs: []
    requirements: {}
    verify: false
    recycle_policy: null
    evidence_verification_gate: false
    depends_on:
      - evidence-gate
    jobs:
      - id: env-destroy
        name: Cleanup
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: stop-laptop-processes
            title: Stop STS2 + SpireLensMcp
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
          - slug: remove-laptop-working-dir
            title: Remove per-run working dir
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
          - slug: tailscale-logout
            title: Tailscale logout
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
          - slug: emit
            title: Emit cleanup
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
        timeout_seconds: 600
        managed: true
        checkout:
          repo: nelsong6/spirelens
          ref: main
          path: /workspace/spirelens
        working_directory: /workspace
    skip_when_preserve_test_env: true
  - name: touchpoint
    kind: k8s_job
    run_on: success
    purpose: review_touchpoint
    workflow_filename: ""
    workflow_ref: main
    inputs: {}
    outputs: []
    requirements: {}
    verify: false
    recycle_policy: null
    evidence_verification_gate: false
    depends_on:
      - cleanup_early
    jobs:
      - id: pr-touchpoint
        name: PR touchpoint
        primitive: pr_touchpoint
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: ensure-pr-touchpoint
            title: Ensure PR touchpoint
            type: run
            run: |
              set -Eeuo pipefail
              if [ -z "${GLIMMUNG_PR_TOUCHPOINT_URL:-}" ]; then
                echo "GLIMMUNG_PR_TOUCHPOINT_URL is not configured" >&2
                exit 2
              fi
              echo "Ensuring PR touchpoint for ${GLIMMUNG_RUN_REF:-unknown run}"
              response="$(mktemp)"
              status="$(curl -sS -o "${response}" -w '%{http_code}' -X POST "${GLIMMUNG_PR_TOUCHPOINT_URL}")" || {
                code="$?"
                echo "PR touchpoint request failed with curl exit ${code}" >&2
                exit "${code}"
              }
              cat "${response}" | jq .
              if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
                echo "PR touchpoint request returned HTTP ${status}" >&2
                exit 1
              fi
              result_status="$(jq -r '.status // empty' "${response}")"
              if [ "${result_status}" = "skipped" ]; then
                echo "PR touchpoint skipped: $(jq -r '.reason // "no reason"' "${response}")"
                exit 0
              fi
              if [ "${result_status}" != "ensured" ]; then
                echo "PR touchpoint returned unexpected status '${result_status}'" >&2
                exit 2
              fi
              pr_number="$(jq -r '.pr_number // empty' "${response}")"
              touchpoint_ref="$(jq -r '.touchpoint_ref // empty' "${response}")"
              html_url="$(jq -r '.html_url // empty' "${response}")"
              {
                if [ -n "${pr_number}" ]; then printf 'pr_number=%s\n' "${pr_number}"; fi
                if [ -n "${touchpoint_ref}" ]; then printf 'touchpoint_ref=%s\n' "${touchpoint_ref}"; fi
                if [ -n "${html_url}" ]; then printf 'pr_url=%s\n' "${html_url}"; fi
              } >>"${GLIMMUNG_OUTPUT_FILE}"
              echo "PR touchpoint ensured: ${touchpoint_ref:-unknown}"
              if [ -n "${html_url}" ]; then
                echo "PR URL: ${html_url}"
              fi
            shell: bash
        timeout_seconds: 120
        managed: true
  - name: touchpoint_gate
    kind: k8s_job
    run_on: success
    purpose: review_gate
    workflow_filename: k8s_job:touchpoint_gate
    workflow_ref: main
    inputs: {}
    outputs: []
    requirements: {}
    verify: false
    recycle_policy: null
    evidence_verification_gate: false
    depends_on:
      - touchpoint
    jobs:
      - id: pr-merge
        name: PR merge
        primitive: pr_merge
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: merge-pull-request
            title: Idempotently merge the touchpoint PR
            type: run
            run: |
              set -Eeuo pipefail
              if [ -z "${GLIMMUNG_PR_MERGE_URL:-}" ]; then
                echo "GLIMMUNG_PR_MERGE_URL is not configured" >&2
                exit 2
              fi
              echo "Merging PR for ${GLIMMUNG_RUN_REF:-unknown run}"
              response="$(mktemp)"
              status="$(curl -sS -o "${response}" -w '%{http_code}' -X POST "${GLIMMUNG_PR_MERGE_URL}")" || {
                code="$?"
                echo "PR merge request failed with curl exit ${code}" >&2
                exit "${code}"
              }
              cat "${response}" | jq .
              if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
                echo "PR merge request returned HTTP ${status}" >&2
                exit 1
              fi
              result_status="$(jq -r '.status // empty' "${response}")"
              case "${result_status}" in
                merged)
                  echo "PR merged: $(jq -r '.merge_commit_sha // ""' "${response}")"
                  ;;
                already_merged)
                  echo "PR was already merged (idempotent success)"
                  ;;
                *)
                  echo "PR merge returned unexpected status '${result_status}'" >&2
                  exit 2
                  ;;
              esac
              pr_number="$(jq -r '.pr_number // empty' "${response}")"
              merge_commit="$(jq -r '.merge_commit_sha // empty' "${response}")"
              {
                if [ -n "${pr_number}" ]; then printf 'pr_number=%s\n' "${pr_number}"; fi
                if [ -n "${merge_commit}" ]; then printf 'merge_commit_sha=%s\n' "${merge_commit}"; fi
                printf 'merge_status=%s\n' "${result_status}"
              } >>"${GLIMMUNG_OUTPUT_FILE}"
            shell: bash
        timeout_seconds: 120
        managed: true
  - name: cleanup_final
    kind: k8s_job
    run_on: always
    purpose: teardown
    workflow_filename: ""
    workflow_ref: main
    inputs: {}
    outputs: []
    requirements: {}
    verify: false
    recycle_policy: null
    evidence_verification_gate: false
    depends_on:
      - touchpoint_gate
    jobs:
      - id: env-destroy-final
        name: Final cleanup
        image: ""
        command: []
        args: []
        env: {}
        steps:
          - slug: stop-laptop-processes
            title: Stop STS2 + SpireLensMcp
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
          - slug: remove-laptop-working-dir
            title: Remove per-run working dir
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
          - slug: tailscale-logout
            title: Tailscale logout
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
          - slug: emit
            title: Emit cleanup
            type: run
            run: /bin/bash /workspace/spirelens/scripts/glimmung-native/env-destroy.sh
        timeout_seconds: 600
        managed: true
        checkout:
          repo: nelsong6/spirelens
          ref: main
          path: /workspace/spirelens
        working_directory: /workspace
pr:
  recycle_policy:
    max_attempts: 3
    "on":
      - pr_review_changes_requested
    lands_at: prepare
budget:
  total: 25
default_requirements: {}
metadata: {}
