name: Go Harness Quality

# Gates the Go run-harness (cmd/glimmung-spirelens + internal/...) that replaced
# the retired shell+pwsh harness (scripts/glimmung-native/*.sh,
# .github/scripts/*.ps1). Replaces ps-quality.yml and glimmung-native-quality.yml.
#
# The binary is two-faced: it must build for the orchestrator pod (Linux) AND
# cross-compile for the gaming laptop (Windows). Both builds, go vet, and the
# full test suite (including the #2/#3 regression guards, the ported Pester/
# UnitTestResult cases, and the migration reintroduction guard) run here.

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.mcp.json'
      - '.github/workflows/go-harness-quality.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.mcp.json'
      - '.github/workflows/go-harness-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: build / vet / test / windows cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/romaine-life/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: go build (linux / pod face)
        run: go build ./...

      - name: go build (windows / host face cross-compile)
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
