name: Glimmung Native Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/glimmung-native/**'
      - 'docs/glimmung-workflow.md'
      - 'docs/laptop-host-setup.md'
      - '.github/workflows/glimmung-native-quality.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/glimmung-native/**'
      - 'docs/glimmung-workflow.md'
      - 'docs/laptop-host-setup.md'
      - '.github/workflows/glimmung-native-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    name: Native script contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          set -Eeuo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts/glimmung-native -type f -name '*.sh' | sort)

      - name: Host checkout contract
        run: |
          set -Eeuo pipefail
          lib='scripts/glimmung-native/lib.sh'
          retired_owner='nelsong6'
          retired_repo='spirelens'
          retired_slug="${retired_owner}/${retired_repo}"

          if grep -RInF "$retired_slug" \
            scripts/glimmung-native docs/glimmung-workflow.md docs/laptop-host-setup.md; then
            echo "retired repo slug is present in live Glimmung paths" >&2
            exit 1
          fi

          grep -Fq 'SPIRELENS_CANONICAL_REPO_URL="https://github.com/romaine-life/spirelens.git"' "$lib"
          grep -Fq 'git -C \$repo remote set-url origin \$remoteUrl' "$lib"
          grep -Fq 'git -C \$repo cat-file -e "\$target^{commit}"' "$lib"

          if grep -nF "origin/main" "$lib"; then
            echo "host checkout sync must not fall back to origin/main" >&2
            exit 1
          fi
