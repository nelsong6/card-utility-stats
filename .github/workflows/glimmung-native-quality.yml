name: Glimmung Native Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/glimmung-native/**'
      - 'docs/glimmung-workflow.md'
      - 'docs/laptop-host-setup.md'
      - 'scripts/test-glimmung-native-contract.sh'
      - '.github/workflows/glimmung-native-quality.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/glimmung-native/**'
      - 'docs/glimmung-workflow.md'
      - 'docs/laptop-host-setup.md'
      - 'scripts/test-glimmung-native-contract.sh'
      - '.github/workflows/glimmung-native-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    name: Native script contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          set -Eeuo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts/glimmung-native -type f -name '*.sh' | sort)
          bash -n scripts/test-glimmung-native-contract.sh

      - name: Verify completion contract
        run: |
          set -Eeuo pipefail
          # The verify phase must write a TYPED verification job completion to
          # GLIMMUNG_COMPLETION_FILE (the run attempt's source-of-truth
          # Verification). Glimmung rejects a verify phase that emits only a
          # `verification` phase output (verifier_contract_missing); this guards
          # against regressing to that retired path.
          bash scripts/test-glimmung-native-contract.sh

      - name: Host checkout contract
        run: |
          set -Eeuo pipefail
          lib='scripts/glimmung-native/lib.sh'
          retired_owner='nelsong6'
          retired_repo='spirelens'
          retired_slug="${retired_owner}/${retired_repo}"

          if grep -RInF "$retired_slug" \
            scripts/glimmung-native docs/glimmung-workflow.md docs/laptop-host-setup.md; then
            echo "retired repo slug is present in live Glimmung paths" >&2
            exit 1
          fi

          grep -Fq 'native_issue_repo()' "$lib"
          grep -Fq 'GLIMMUNG_ISSUE_REPO' "$lib"
          grep -Fq 'native_issue_repo_url()' "$lib"
          if sed -n '/native_issue_repo()/,/^}/p' "$lib" | grep -Eq 'repo=.*#https://github.com|repo=.*%.git'; then
            echo "native_issue_repo must use GLIMMUNG_ISSUE_REPO directly, not normalize it" >&2
            exit 1
          fi
          if grep -nF 'SPIRELENS_CANONICAL_REPO_URL' "$lib"; then
            echo "host checkout sync must derive the primary repo from GLIMMUNG_ISSUE_REPO" >&2
            exit 1
          fi
          grep -Fq 'native_mint_github_token()' "$lib"
          grep -Fq 'native_github_token_b64()' "$lib"
          grep -Fq 'native_github_token: cached token is blank' "$lib"
          grep -Fq 'FromBase64String' "$lib"
          grep -Fq 'C:/Windows/Temp/glimmung-' "$lib"
          grep -Fq 'scp $(native_ssh_args)' "$lib"
          grep -Fq 'pwsh -NoProfile -ExecutionPolicy Bypass -File "$remote_script"' "$lib"
          grep -Fq 'http.https://github.com/.extraheader=\$authHeader' "$lib"
          grep -Fq 'git -C \$repo remote set-url origin \$remoteUrl' "$lib"
          grep -Fq 'git -C \$repo cat-file -e "\$target^{commit}"' "$lib"
          grep -Fq 'git -C \$repo clean -ffdx' "$lib"
          grep -Fq 'gh_token_b64="$(native_github_token_b64)"' scripts/glimmung-native/test-plan.sh
          grep -Fq -- '-GitHubToken \$ghToken' scripts/glimmung-native/test-plan.sh
          grep -Fq 'git push --force \$remote "HEAD:refs/heads/\$branch"' scripts/glimmung-native/implement.sh
          grep -Fq "fetch origin '\${GLIMMUNG_INPUT_BRANCH_NAME}'" scripts/glimmung-native/verify.sh

          if grep -nF "origin/main" "$lib"; then
            echo "host checkout sync must not fall back to origin/main" >&2
            exit 1
          fi
          if grep -RInF 'GLIMMUNG_PROJECT_REPO:-romaine-life/spirelens' scripts/glimmung-native; then
            echo "native scripts must not hard-code the project repo fallback" >&2
            exit 1
          fi

      - name: Retired workflow shapes
        run: |
          set -Eeuo pipefail
          # Migration policy: the pre-implementation issue-contract stage and the
          # standalone evidence-gate phase are retired end to end. The llm-verify
          # phase owns its verdict + recycle policy, and cleanup_early gates
          # teardown with a `when` condition. Fail if any retired shape returns to
          # the native scripts.
          if [ -e scripts/glimmung-native/issue-contract.sh ]; then
            echo "retired issue-contract stage script reintroduced" >&2
            exit 1
          fi
          for tok in \
            GLIMMUNG_INPUT_ISSUE_CONTRACT \
            ISSUE_CONTRACT_REPO_PATH \
            evidence_verification_gate \
            skip_when_preserve_test_env; do
            if grep -RInF "$tok" scripts/glimmung-native; then
              echo "retired workflow token '$tok' reintroduced in native scripts" >&2
              exit 1
            fi
          done
