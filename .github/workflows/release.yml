name: Build and Release SpireLens Mod

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore SpireLens.csproj

      - name: Build Core (Release)
        run: dotnet build Core/SpireLens.Core.csproj -c Release -p:SkipModsDeploy=true

      - name: Build Loader (Release)
        run: dotnet build SpireLens.csproj -c Release -p:SkipModsDeploy=true

      - name: Build Tests (Release)
        run: dotnet build Tests/SpireLens.Core.Tests/SpireLens.Core.Tests.csproj -c Release -p:SkipModsDeploy=true

      - name: Package Mod files
        shell: pwsh
        run: |
          # Create staging folder structure
          $stagingDir = New-Item -ItemType Directory -Path "build_staging/SpireLens" -Force

          # Copy Loader DLL and mod manifest
          Copy-Item -Path ".godot/mono/temp/bin/Release/SpireLens.dll" -Destination $stagingDir -Force
          Copy-Item -Path "SpireLens.json" -Destination $stagingDir -Force

          # Copy Core DLL
          Copy-Item -Path "Core/bin/Release/net9.0/SpireLens.Core.dll" -Destination $stagingDir -Force

          # Copy Mono.Cecil dependencies
          Copy-Item -Path ".godot/mono/temp/bin/Release/Mono.Cecil*.dll" -Destination $stagingDir -Force

          # Package staging folder into Zip archive
          Compress-Archive -Path "build_staging/SpireLens" -DestinationPath "SpireLens.zip" -Force
          Write-Host "Mod successfully packaged into SpireLens.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpireLens-Package
          path: SpireLens.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpireLens.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workshop:
    name: Publish Steam Workshop
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: steam-workshop
    concurrency:
      group: steam-workshop
      cancel-in-progress: false
    env:
      STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}

    steps:
      - name: Download packaged mod
        uses: actions/download-artifact@v4
        with:
          name: SpireLens-Package
          path: workshop_artifact

      - name: Validate tagged package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $archive = Join-Path $PWD "workshop_artifact/SpireLens.zip"
          $contentRoot = Join-Path $PWD "workshop_content"
          Expand-Archive -LiteralPath $archive -DestinationPath $contentRoot -Force

          $modDirectory = Join-Path $contentRoot "SpireLens"
          $manifestPath = Join-Path $modDirectory "SpireLens.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "The package does not contain SpireLens/SpireLens.json."
          }

          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.version -ne $env:GITHUB_REF_NAME) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match manifest version '$($manifest.version)'."
          }

          $expectedFiles = @(
            "Mono.Cecil.dll",
            "Mono.Cecil.Mdb.dll",
            "Mono.Cecil.Pdb.dll",
            "Mono.Cecil.Rocks.dll",
            "SpireLens.Core.dll",
            "SpireLens.dll",
            "SpireLens.json"
          )
          $actualFiles = @(
            Get-ChildItem -LiteralPath $modDirectory -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $unexpected = @($actualFiles | Where-Object { $_ -notin $expectedFiles })
          $missing = @($expectedFiles | Where-Object { $_ -notin $actualFiles })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            throw "Unexpected package contents. Missing: [$($missing -join ', ')]. Unexpected: [$($unexpected -join ', ')]."
          }

      - name: Install SteamCMD
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $steamDirectory = Join-Path $PWD "steamcmd"
          $steamArchive = Join-Path $PWD "steamcmd.zip"
          New-Item -ItemType Directory -Path $steamDirectory -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" `
            -OutFile $steamArchive
          Expand-Archive -LiteralPath $steamArchive -DestinationPath $steamDirectory -Force

          # A fresh SteamCMD can replace and relaunch itself, then return exit
          # code 7 even though the update completed. Retry the installed client
          # once and require that post-update invocation to exit cleanly.
          $steamExecutable = Join-Path $steamDirectory "steamcmd.exe"
          & $steamExecutable "+quit"
          if ($LASTEXITCODE -ne 0) {
            $firstExitCode = $LASTEXITCODE
            Write-Warning "SteamCMD initial bootstrap exited with code $firstExitCode; retrying the updated client."
            & $steamExecutable "+quit"
            if ($LASTEXITCODE -ne 0) {
              throw "SteamCMD post-update bootstrap failed with exit code $LASTEXITCODE (initial exit code $firstExitCode)."
            }
          }

      - name: Restore Steam publishing credential
        shell: pwsh
        env:
          STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:STEAM_CONFIG_VDF_B64)) {
            throw "The steam-workshop environment is missing STEAM_CONFIG_VDF_B64."
          }
          if ([string]::IsNullOrWhiteSpace($env:STEAM_USERNAME)) {
            throw "The steam-workshop environment is missing STEAM_USERNAME."
          }

          Write-Output "::add-mask::$env:STEAM_USERNAME"
          $configDirectory = Join-Path $PWD "steamcmd/config"
          New-Item -ItemType Directory -Path $configDirectory -Force | Out-Null
          $configBytes = [Convert]::FromBase64String($env:STEAM_CONFIG_VDF_B64)
          [IO.File]::WriteAllBytes(
            (Join-Path $configDirectory "config.vdf"),
            $configBytes)

      - name: Publish Workshop item
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          Write-Output "::add-mask::$env:STEAM_USERNAME"
          $contentRoot = (Resolve-Path (Join-Path $PWD "workshop_content")).Path
          $escapedContentRoot = $contentRoot.Replace("\", "\\")
          $workshopConfig = Join-Path $PWD "workshop-item.vdf"
          @"
          "workshopitem"
          {
              "appid"            "2868840"
              "publishedfileid"  "3774710835"
              "contentfolder"    "$escapedContentRoot"
              "changenote"       "SpireLens $env:GITHUB_REF_NAME"
          }
          "@ | Set-Content -LiteralPath $workshopConfig -Encoding utf8

          $steamLog = Join-Path $PWD "steamcmd-workshop.log"
          & (Join-Path $PWD "steamcmd/steamcmd.exe") `
            "+login" $env:STEAM_USERNAME `
            "+workshop_build_item" $workshopConfig `
            "+quit" 2>&1 |
            Tee-Object -FilePath $steamLog
          $steamExitCode = $LASTEXITCODE
          $logText = Get-Content -Raw -LiteralPath $steamLog

          if ($steamExitCode -ne 0) {
            throw "SteamCMD exited with code $steamExitCode."
          }
          if ($logText -match "(?im)^\s*ERROR!|login failure|failed to update workshop item") {
            throw "SteamCMD reported a Workshop publishing failure."
          }
          if ($logText -notmatch "(?im)^\s*Success[.!]?\s*$") {
            throw "SteamCMD did not report a successful Workshop update."
          }
